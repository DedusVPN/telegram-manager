[project]
name = "telegram-account-manager-bot"
version = "0.1.0"
description = "Telegram bot and web platform for managing multiple Telegram accounts"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiogram==3.3.0",
    "telethon==1.34.0",
    "sqlalchemy==2.0.25",
    "aiosqlite==0.19.0",
    "cryptography==42.0.0",
    "python-dotenv==1.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-jose[cryptography]>=3.3.0",
    "python-multipart>=0.0.12",
]

[tool.uv]
package = false
